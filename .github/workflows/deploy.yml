name: Deploy via Jump Server with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Private Server via Jump Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Target Private Server
          host: ${{ vars.PRIVATE_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22

          # Jump Server (Bastion) Settings
          proxy_host: ${{ vars.JUMP_HOST }}
          proxy_username: ${{ vars.SSH_USER }}
          proxy_key: ${{ secrets.DEPLOY_SSH_KEY }}
          proxy_port: 22

          script: |
            # Navigate to your project directory
            cd GitHub-Actions-Demo
            
            # Pull the latest code changes from GitHub
            git pull origin main
            
            # Build the Docker image locally on EC2
            docker build -t github-actions-ec2-demo:latest .
            
            # Stop and remove the old container if it exists
            docker stop github-actions-ec2-demo || true
            docker rm github-actions-ec2-demo || true
            
            # Run the newly built container
            docker run -d \
              --name github-actions-ec2-demo \
              -p 80:80 \
              --restart unless-stopped \
              github-actions-ec2-demo:latest
              
            # Clean up dangling images to save disk space
            docker image prune -f
